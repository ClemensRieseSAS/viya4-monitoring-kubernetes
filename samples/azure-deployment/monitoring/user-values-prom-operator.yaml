# Place overrides for the Prometheus Operator Helm Chart Here

# Prometheus Operator Helm Chart
# https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
#
# CRDs
# https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md
#
# Default Values
# https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml

# Access to the web applications (Contour HTTPProxy resources, routePrefix,
# externalUrl and grafana.ini server settings) is auto-generated from the
# AUTOGENERATE_INGRESS settings in ../user.env.
# Values set here are passed to Helm after the auto-generated values and
# override them. Do not set ingress, routePrefix, externalUrl or grafana.ini
# server keys here unless you want to override the auto-generated values.
# The relevant AKS-specific settings for this sample are just the 'storageClassName:'
# sections below referencing the custom azuredisk-v4m storage class.

prometheus:
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
         storageClassName: azuredisk-v4m

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: azuredisk-v4m

grafana:
  # Disable default configuration of NodePort
  service:
    type: ClusterIP
    nodePort: null
  persistence:
    storageClassName: azuredisk-v4m
